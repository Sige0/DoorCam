<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DoorCam</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div>
            <span class="title">DoorCam</span>
            <span class="live">Live</span>
            <span class="motion" id="motion"></span>
            <span class="away" id="away" hidden></span>
        </div>
        <nav>
            <form method="post" action="{{ url_for('set_away') }}">
                {% if away_on %}
                    <input type="hidden" name="on" value="0">
                    <button class="away-button on" type="submit">Abwesend ausschalten</button>
                {% else %}
                    <input type="hidden" name="on" value="1">
                    <button class="away-button" type="submit">Abwesend einschalten</button>
                {% endif %}
            </form>
            <form method="post" action="{{ url_for('save_clip') }}">
                <button type="submit">Letzte {{ clip_seconds }} s speichern</button>
            </form>
            <a href="{{ url_for('recordings') }}">Aufnahmen</a>
            <form method="post" action="{{ url_for('auth.logout') }}">
                <button type="submit">Logout</button>
            </form>
        </nav>
    </header>
    <main>
        <img src="{{ url_for('stream') }}" alt="Livebild">
    </main>

    {% for msg in get_flashed_messages() %}
        <p class="toast">{{ msg }}</p>
    {% endfor %}

    <script>
        const motion = document.getElementById("motion");
        const away = document.getElementById("away");

        async function updateStatus() {
            try {
                const response = await fetch("{{ url_for('status') }}");
                const data = await response.json();
                motion.textContent = data.motion ? "Bewegung erkannt" : "Keine Bewegung";
                motion.classList.toggle("active", data.motion);

                away.hidden = !data.away.on;
                away.classList.toggle("active", data.away.active);
                away.textContent = data.away.active
                    ? "Abwesend aktiv"
                    : `Abwesend in ${data.away.seconds_left} s`;
            } catch {
                motion.textContent = "";  // app not reachable
            }
        }

        updateStatus();
        setInterval(updateStatus, 1000);
    </script>
</body>
</html>
