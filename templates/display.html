<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DoorCam Display</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='display.css') }}">
</head>
<body>
    <img id="cam" src="{{ url_for('display_stream') }}" alt="">

    <details class="menu" id="menu">
        <summary aria-label="Menü">•••</summary>
        <div class="menu-panel">
            <form method="post" action="{{ url_for('save_clip') }}">
                <button type="submit">Letzte {{ clip_seconds }} s speichern</button>
            </form>
            <a href="{{ url_for('recordings') }}">Aufnahmen</a>
            <form method="post" action="{{ url_for('display_away_on') }}" id="away-on">
                <button type="submit">Abwesend einschalten</button>
            </form>
        </div>
    </details>

    <div class="away" id="away" hidden></div>

    {% for msg in get_flashed_messages() %}
        <p class="toast">{{ msg }}</p>
    {% endfor %}

    <script>
        // reconnect if the stream breaks, e.g. after a service restart
        const cam = document.getElementById("cam");
        cam.onerror = () => {
            setTimeout(() => {
                cam.src = "{{ url_for('display_stream') }}?t=" + Date.now();
            }, 2000);
        };

        // tap on the image closes the menu
        const menu = document.getElementById("menu");
        cam.onclick = () => menu.open = false;

        // away mode badge, top right
        const away = document.getElementById("away");
        const awayOn = document.getElementById("away-on");

        async function updateStatus() {
            try {
                const response = await fetch("{{ url_for('status') }}");
                const data = await response.json();
                away.hidden = !data.away.on;
                awayOn.hidden = data.away.on;  // button only while off
                away.classList.toggle("active", data.away.active);
                away.textContent = data.away.active
                    ? "Abwesend aktiv"
                    : `Abwesend in ${data.away.seconds_left} s`;
            } catch {
                // app restarting, try again next time
            }
        }

        updateStatus();
        setInterval(updateStatus, 1000);
    </script>
</body>
</html>
